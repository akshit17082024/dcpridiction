<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="og:title" content="MSS - My Sehat Sakhi">
    <meta name="og:image" content="static/logo1.png">
  <meta name="Keywords" content="Flask, Machine Learning, Deep Learning, Artificial Intelligence, AI, ML,DL, Web Development">
  <meta name="description" content="A Machine Learning and Deep Learning based webapp for Multiple Disease Prediction.">
  <title>MSS - My Sehat Sakhi</title>
  <link rel="icon" href="{{ url_for('static', filename = 'logo1.png') }}" type="image/icon type">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet"/>
    <link rel="canonical" href="https://getbootstrap.com/docs/4.0/examples/sticky-footer/">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  
  <style>
    html, body{ height:100%; margin:0; }
header{ height:50px;}
footer{ height:75px; }

/* Trick */
body{ 
  display:flex; 
  flex-direction:column; 
}

footer{
  padding:10px;
  margin-top:auto;
  margin-bottom: auto; 
}

.brand-link{ display:flex; align-items:center; text-decoration:none !important; }
.brand-icon{ height:52px; width:auto; margin-right:12px; }
.brand-text{ display:flex; flex-direction:column; line-height:1; }
.brand-title{ color:#fff; font-size:2rem; font-weight:700; letter-spacing:3px; text-transform:uppercase; font-family: Georgia, 'Times New Roman', serif; }
.brand-sub{ color:#cfd8dc; font-size:0.8rem; letter-spacing:1px; margin-top:3px; font-family: Georgia, 'Times New Roman', serif; }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-dark">
        <a href="{{ url_for('home') }}" class="brand-link">
            <img src="{{ url_for('static', filename = 'logo_icon.png') }}" class="brand-icon" alt="MSS logo">
            <span class="brand-text"><span class="brand-title">MSS</span><span class="brand-sub">My Sehat Sakhi</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
           <span class="navbar-toggler-icon"></span>
         </button>
         <div class="collapse navbar-collapse" id="navbarNav">
           <ul class="navbar-nav ml-auto">
             <li class="nav-item active">
               <a href="{{ url_for('home') }}" class="nav-link {{ 'current' if request.endpoint == 'home' }}">Home</a>
             </li>
             <li class="nav-item active">
               <a class="nav-link {{ 'current' if request.endpoint == 'diabetesPage' }}" href="{{ url_for('diabetesPage') }}">Diabetes</a>
             </li>
             <li class="nav-item active">
                <a class="nav-link {{ 'current' if request.endpoint == 'heartPage' }}" href="{{ url_for('heartPage') }}">Heart</a>
             </li>
             <li class="nav-item active">
                <a class="nav-link {{ 'current' if request.endpoint == 'kidneyPage' }}" href="{{ url_for('kidneyPage') }}">Kidney</a>
              </li>
              <li class="nav-item active">
                <a class="nav-link {{ 'current' if request.endpoint == 'liverPage' }}" href="{{ url_for('liverPage') }}">Liver</a>
              </li>
              <li class="nav-item active">
                <a class="nav-link {{ 'current' if request.endpoint == 'malariaPage' }}" href="{{ url_for('malariaPage') }}">Malaria</a>
              </li>
              <li class="nav-item active">
                <a class="nav-link {{ 'current' if request.endpoint == 'pneumoniaPage' }}" href="{{ url_for('pneumoniaPage') }}">Pneumonia</a>
              </li>
           </ul>
         </div>
       </nav>
<main>
	<div class="container-fluid" style="margin-bottom: 20px;">
	{% block content %}

	{% endblock %}
    </div>
  </main>
</body>
</html>
